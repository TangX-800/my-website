<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金融 App 重新设计 | 项目详情</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --text-main: #1d1d1f;
            --text-sub: #6e6e73;
            --accent: #0071e3;
            --card-bg: #f5f5f7;
            --border: #eeeeee;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* --- 顶部导航 --- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 10%;
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .back-button {
            color: var(--text-main);
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            transition: var(--transition);
        }

        .back-button:hover {
            color: var(--accent);
        }

        /* --- 项目标题 --- */
        main {
            padding: 7% 10% 8%;
        }

        .project-header {
            max-width: 900px;
            margin-bottom: 4rem;
        }

        .project-category {
            margin-bottom: 1rem;
            color: var(--accent);
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        h1 {
            margin-bottom: 1.5rem;
            font-size: clamp(2.8rem, 8vw, 5rem);
            font-weight: 800;
            letter-spacing: -2px;
            line-height: 1.05;
        }

        .project-summary {
            max-width: 680px;
            color: var(--text-sub);
            font-size: 1.2rem;
        }

        /* --- 项目大图占位区 --- */
        .project-image {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 1400px;
            aspect-ratio: 16 / 9;
            margin-bottom: 5rem;
            overflow: hidden;
            border-radius: 24px;
            background: var(--card-bg);
            color: #a1a1a6;
            font-style: italic;
            text-align: center;
        }

        /* --- 项目介绍 --- */
        .project-introduction {
            display: grid;
            grid-template-columns: minmax(180px, 1fr) minmax(0, 2fr);
            gap: 4rem;
            max-width: 1000px;
        }

        .project-introduction h2 {
            font-size: 1.8rem;
            line-height: 1.25;
        }

        .project-copy p {
            margin-bottom: 1.25rem;
            color: var(--text-sub);
            font-size: 1.05rem;
        }

        /* --- 页脚 --- */
        footer {
            padding: 3rem 10%;
            border-top: 1px solid var(--border);
            color: var(--text-sub);
            font-size: 0.9rem;
            text-align: center;
        }

        /* --- 手机端适配 --- */
        @media (max-width: 768px) {
            nav {
                padding: 1.5rem 5%;
            }

            main {
                padding: 15% 5% 18%;
            }

            .project-header {
                margin-bottom: 2.5rem;
            }

            .project-image {
                margin-bottom: 3.5rem;
                border-radius: 16px;
            }

            .project-introduction {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">DESIGNER.NAME</div>
        <a href="/" class="back-button">← 返回首页</a>
    </nav>

    <main>
        <header class="project-header">
            <p class="project-category">移动端 / 用户研究 / 视觉系统</p>
            <h1>金融 App 重新设计</h1>
            <p class="project-summary">通过更清晰的信息架构与更友好的视觉语言，让复杂的金融服务变得简单、可信且易于使用。</p>
        </header>

        <div class="project-image" role="img" aria-label="金融 App 项目大图占位区">
            [ 项目大图占位区 · 建议尺寸 1600 × 900px ]
        </div>

        <section class="project-introduction" aria-labelledby="introduction-title">
            <h2 id="introduction-title">项目介绍</h2>
            <div class="project-copy">
                <p>本项目聚焦于金融 App 的核心使用体验，重新梳理账户、资产与交易信息，帮助用户更快找到重要内容，并降低理解复杂数据的门槛。</p>
                <p>设计过程涵盖用户需求分析、信息架构调整和视觉系统优化。页面采用清晰的层级、克制的色彩与一致的组件，让产品在专业感与亲和力之间取得平衡。</p>
            </div>
        </section>
    </main>

    <footer>
        <p>金融 App 重新设计 · 项目案例</p>
    </footer>

</body>
</html>
